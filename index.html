l{margin:9px 0 0;padding-right:20px;color:#aeb5b9;line-height:1.9}.quiz{margin-top:12px;border:1px solid #2c3730;background:#0e1410;border-radius:14px;padding:19px}.quiz h3{margin:0 0 13px}.answers{display:grid;gap:8px}.answer{background:#12181b;border:1px solid #293139;border-radius:10px;padding:12px;text-align:right}.answer.correct{border-color:#6a8c43;background:#172211}.answer.wrong{border-color:#7b4141;background:#211315}.feedback{margin-top:12px;color:#9da7ad;font-size:13px}.paperTop{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:10px}.paperGrid{display:grid;grid-template-columns:1.5fr .7fr;gap:12px;margin-top:12px}.chart{height:300px}.chart svg{width:100%;height:250px}.chart .up{stroke:var(--lime)}.tradeBox input{width:100%;background:#0a0e11;border:1px solid #293138;border-radius:9px;padding:11px;color:white;margin-top:6px;outline:none}.tradeBox label{display:block;color:#7e878e;font-size:11px;margin-top:11px}.tradeBox button{width:100%;border:0;border-radius:9px;padding:11px;background:var(--lime);color:#091006;font-weight:900;margin-top:14px}.tradeLog{margin-top:10px}.tradeRow{display:flex;justify-content:space-between;border-top:1px solid #1d252a;padding:11px 0;font-size:12px}.tradeRow:first-child{border-top:0}.positive{color:var(--lime)}.analyzeSearch{display:flex;gap:7px;margin-bottom:11px}.analyzeSearch input{flex:1;background:#0e1317;border:1px solid #293138;border-radius:10px;padding:12px;color:#fff;outline:none}.analyzeSearch button{border:0;background:var(--lime);color:#091006;border-radius:10px;padding:0 17px;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#242c32;margin-top:16px}.metric{background:#0d1114;padding:14px}.metric small{color:#6c767e;display:block;font-size:9px}.metric b{display:block;margin-top:4px}.terms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.term{border:1px solid var(--line);background:#0d1114;border-radius:13px;padding:18px}.term span{font:700 11px 'Space Gro </style></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="logo">M</span><div><b>Market</b><small>ACADEMY</small></div></div><nav class="nav" id="nav"></nav><div class="sideTip"><span class="mini">NEXT MISSION</span><b>שיעור 01</b><p>מה זה שוק ההון?</p></div></aside><main class="content"><div class="top"><div><span class="eyebrow">PERSONAL MARKET LAB</span><h1 id="pageTitle">בונים הבנה אמיתית של השוק.</h1></div><div class="user"><div class="avatar">י</div><div class="name"><b>יהודה</b><small id="userProgress">Beginner · 0%</small></div></div></div><div class="install" id="installBox">📱 רוצה שזה ירגיש כמו אפליקציה? ב־Safari: שיתוף → Add to Home Screen</div><div id="app"></div></main><nav class="bottomNav" id="bottomNav"></nav><div class="toast" id="toast"></div></div><script>
const lessons=[
['01','מה זה שוק ההון?','מניה · בורסה · מדד · ETF','מניה היא חלק קטן מבעלות בחברה. הבורסה היא המקום שבו קונים ומוכרים ניירות ערך, ומדד הוא דרך למדוד סל של חברות. ETF הוא קרן שמאפשרת להחזיק סל נכסים במכשיר אחד.'],
['02','איך מניה מתומחרת?','היצע · ביקוש · שווי שוק','מחיר שוק הוא המחיר שבו קונים ומוכרים מסכימים להחליף בעלות ברגע נתון. שווי השוק של חברה הוא מחיר המניה כפול מספר המניות.'],
['03','להבין חברה','הכנסות · רווח · תזרים · חוב','לפני שמסתכלים על גרף, לומדים את העסק: כמה הוא מוכר, כמה נשאר כרווח, כמה מזומן הוא מייצר ומה רמת החוב שלו.'],
['04','לקרוא מספרים','P/E · צמיחה · Margin · ROIC','יחסים פיננסיים עוזרים להשוות בין חברות ולשאול שאלות. הם לא תשובה בפני עצמם: צריך להבין מה עומד מאחוריהם.'],
['05','לבנות השקעה','ETF · פיזור · הקצאה','פיזור הוא דרך להפחית תלות בנכס בודד. הקצאה מגדירה כמה מהתיק נמצא בכל סוג נכס בהתאם למטרה ולסיכון.'],
['06','Trading','מגמה · Volume · תמיכה · התנגדות','Trading הוא ניסיון לפעול לפי מערכת כללים על תנועות מחיר. גרפים הם כלי, לא הבטחה לתוצאה.'],
['07','Risk Management','Position Size · Stop · R:R','הדבר הראשון הוא להגדיר כמה מותר להפסיד. רק אחר כך קובעים גודל פוזיציה, נקודת יציאה ויחס סיכון/תגמול.'],
['08','Backtesting','בדיקה היסטורית · סטטיסטיקה','לפני שסומכים על רעיון, בודקים אותו על נתונים היסטוריים לפי כללים קבועים ומודדים גם תקופות גרועות, לא רק הצלחות.'],
['09','Short & Leverage','שורט · מינוף · סיכון','שורט ומינוף יכולים להגדיל חשיפה והפסדים. נלמד את המכניקה והסיכונים בסימולציה בלבד לפני כל דיון על שימוש אמיתי.'],
['10','בונים שיטה','חוקים · יומן · מדידה','שיטה טובה היא מערכת של תנאי כניסה, יציאה, ניהול סיכון ותיעוד. המטרה היא תהליך שאפשר לבדוק — לא ניחושים.']];
const nav=[['home','⌂','בית'],['learn','◈','לימוד'],['paper','↗','סימולטור'],['analyze','⌁','Stock Lab'],['glossary','?','מילון']];
let state=JSON.parse(localStorage.getItem('ma-state')||'{"done":[],"xp":0,"trades":[],"notes":{}}');
const save=()=>{localStorage.setItem('ma-state',JSON.stringify(state));updateHeader()};
function updateHeader(){let p=Math.round(state.done.length/10*100);document.getElementById('userProgress').textContent=`${p===0?'Beginner':p<50?'Learning':'Market Ready'} · ${p}%`}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function setNav(x){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===x))}
function home(){let p=state.done.length*10;document.getElementById('app').innerHTML=`<section class="hero"><div><span class="pill">● ${p?'ממשיכים מאיפה שעצרת':'מתחילים מאפס'}</span><h2>לומדים. מתרגלים.<br><em>בודקים לפני שמסכנים.</em></h2><p>מסלול אישי מהבסיס ועד ניתוח חברות, השקעות, Trading, ניהול סיכונים ו־Backtesting. כל שלב נפתח דרך הבנה ותרגול.</p><button class="primary" onclick="learn(${state.done.length<10?state.done.length:0})">${p?'המשך ללמוד':'התחל שיעור 01'} ←</button></div><div class="heroStat"><small>MARKET IQ</small><strong>${String(state.done.length+1).padStart(2,'0')}</strong><span>${p?`${p}% המסלול הושלם`:'Foundations'}</span><div class="bar"><i style="width:${p}%"></i></div></div></section><div class="dashgrid"><div class="card"><span class="statLabel">YOUR PROGRESS</span><div class="big">${state.done.length} / 10</div><div class="bar"><i style="width:${p}%"></i></div><p class="muted">${state.xp} XP · ${state.trades.length} פעולות בסימולטור</p></div><div class="card"><span class="statLabel">NEXT</span><div class="big lime">${lessons[Math.min(state.done.length,9)][0]}</div><p class="muted">${lessons[Math.min(state.done.length,9)][1]}</p></div><div class="card rule"><span class="statLabel">RULE #01</span><h3>לא מחפשים “מניה חמה”.</h3><p>קודם מבינים. אחר כך בודקים.</p></div></div><div class="section"><div class="sectionHead"><div><span class="eyebrow">YOUR CURRICULUM</span><h2>המסלול שלך</h2></div><button class="ghost" onclick="show('learn')">כל המסלול →</button></div><div class="lessonGrid">${lessons.slice(0,6).map((l,i)=>`<button class="lessonCard" onclick="learn(${i})"><span class="num">${l[0]}</span><main><b>${l[1]}</b><small>${l[2]}</small></main><span class="status">${state.done.includes(i)?'✓':'→'}</span></button>`).join('')}</div></div>`;document.getElementById('pageTitle').textContent='בונים לך הבנה אמיתית של השוק.'}
function learn(i=0){let l=lessons[i];document.getElementById('app').innerHTML=`<div class="learnWrap"><div class="lessonList">${lessons.map((x,n)=>`<button class="${n===i?'active':''}" onclick="learn(${n})"><span>${x[0]}</span>${x[1]} ${state.done.includes(n)?'✓':''}</button>`).join('')}</div><article class="article"><span class="pill">שיעור ${l[0]} · ${l[2]}</span><h2>${l[1]}</h2><p class="lead">לא רק לזכור הגדרה — להבין איך לחשוב עם המושג.</p><div class="concept"><div class="tag">CORE IDEA</div><h3>${i===0?'מניה היא בעלות בחברה — לא מספר שקופץ על גרף.':'הכלל: קודם להבין את המנגנון, אחר כך להשתמש בו.'}</h3><p>${l[3]}</p></div><div class="two"><div class="card"><span class="statLabel">מה צריך לדעת</span><ul><li>${i===0?'מהי מניה ומהי חברה':'מה המושג אומר בפועל'}</li><li>${i<5?'איך לקרוא את הנתון':'איך הוא משתלב בתהליך'}</li><li>מה הוא לא אומר</li><li>מתי צריך לבדוק עוד מידע</li></ul></div><div class="card"><span class="statLabel">MISSION</span><h3>${i===0?'להבדיל בין מניה, מדד ו־ETF':'לנסח את הרעיון במילים שלך'}</h3><p class="muted">אחרי התשובה תקבל משוב ונקודת XP.</p></div></div><div class="quiz"><h3>${quiz(i).q}</h3><div class="answers">${quiz(i).a.map((a,n)=>`<button class="answer" onclick="answer(${i},${n})">${a}</button>`).join('')}</div><div id="feedback" class="feedback">בחר תשובה. אם טעית, נסביר למה.</div></div>${state.done.includes(i)?'<div class="pill" style="margin-top:14px">✓ השיעור הושלם</div>':''}</article></div>`;document.getElementById('pageTitle').textContent='Learning Path'}
function quiz(i){const qs=[{q:'מה קנית כשקנית מניה?',a:['חלק בעלות בחברה','הלוואה לממשלה','רק גרף מחיר'],c:0},{q:'שווי שוק מחושב בקירוב כ־?',a:['מחיר מניה × מספר מניות','רווח ÷ חוב','מחזור ÷ מניות'],c:0},{q:'איזה נתון אומר כמה החברה מוכרת?',a:['הכנסות','מחיר מניה','Volume'],c:0},{q:'מה P/E מתאר?',a:['מחיר ביחס לרווח','חוב ביחס למזומן','מספר המניות'],c:0},{q:'למה מפזרים השקעה?',a:['להפחית תלות בנכס יחיד','להבטיח רווח','להעלות מינוף'],c:0},{q:'מהו Trading?',a:['פעולה לפי מערכת כללים על תנועות מחיר','הבטחה למחיר עתידי','קנייה בלי תוכנית'],c:0},{q:'מה קודם לקביעת גודל פוזיציה?',a:['להגדיר סיכון מקסימלי','לבחור מניה אקראית','להגדיל מינוף'],c:0},{q:'מה בודק Backtest?',a:['איך כלל התנהג על נתונים היסטוריים','מה יקרה בוודאות מחר','רק את העסקה הכי טובה'],c:0},{q:'מה עלול לקרות במינוף?',a:['החשיפה וההפסד האפשרי גדלים','הסיכון נעלם','אין שינוי'],c:0},{q:'מה חייב להיות בשיטה?',a:['כללי כניסה/יציאה וניהול סיכון','ניחוש יומי','מניה אחת בלבד'],c:0}];return qs[i]}
function answer(i,n){const q=quiz(i), f=document.getElementById('feedback');document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('correct');if(j===n&&n!==q.c)b.classList.add('wrong')});if(n===q.c){if(!state.done.includes(i)){state.done.push(i);state.xp+=100;save();}f.innerHTML='<span class="lime">✓ נכון.</span> הבנת את העיקרון. +100 XP';toast('+100 XP · שיעור הושלם')}else f.textContent='כמעט. התשובה המסומנת בירוק היא הנכונה — חזור על הרעיון המרכזי ונסה שוב.';}
function chart(){return `<div class="chart"><svg viewBox="0 0 760 250" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8f25f" stop-opacity=".22"/><stop offset="1" stop-color="#b8f25f" stop-opacity="0"/></linearGradient></defs><path d="M0 210 L60 190 L105 198 L150 165 L205 178 L250 122 L305 142 L355 95 L405 115 L470 70 L525 92 L590 48 L650 66 L760 28 L760 250 L0 250Z" fill="url(#g)"/><polyline points="0,210 60,190 105,198 150,165 205,178 250,122 305,142 355,95 405,115 470,70 525,92 590,48 650,66 760,28" fill="none" class="up" stroke-width="4"/></svg><div class="muted">DEMO CHART · נתוני המחשה בלבד</div></div>`}
function paper(){document.getElementById('app').innerHTML=`<div class="sectionHead"><div><span class="eyebrow">PAPER TRADING LAB</span><h2>סימולטור מסחר</h2></div><span class="pill">כסף וירטואלי בלבד</span></div><div class="paperTop"><div class="card"><span class="statLabel">PORTFOLIO</span><div class="big">$100,000</div><span class="muted">יתרה התחלתית ללמידה</span></div><div class="card"><span class="statLabel">TRADES</span><div class="big">${state.trades.length}</div><span class="muted">פעולות שנרשמו</span></div><div class="card"><span class="statLabel">MODE</span><div class="big lime">LEARNING</div><span class="muted">ללא כסף אמיתי</span></div></div><div class="paperGrid"><div class="card"><div class="sectionHead" style="margin:0"><h3>Market Preview</h3><span class="eyebrow">DEMO</span></div>${chart()}</div><div class="card tradeBox"><h3>תרגול פעולה</h3><p class="muted">בחר פעולה וכתוב למה. המטרה היא ללמוד תהליך, לא לרדוף אחרי רווח.</p><label>TICKER<input id="ticker" value="AAPL"></label><label>QUANTITY<input id="qty" type="number" value="10" min="1"></label><button onclick="paperTrade()">רשום פעולה</button><div class="tradeLog">${state.trades.slice(-4).reverse().map(t=>`<div class="tradeRow"><span>${t.side} · ${t.ticker}</span><span class="positive">${t.qty} יח׳</span></div>`).join('')}</div></div></div><div class="card" style="margin-top:12px"><b>כלל המעבדה</b><p class="muted">אנחנו לא משתמשים כאן בנתוני שוק חיים כדי ליצור אשליה של דיוק. כשנחבר מקור נתונים אמיתי, כל מספר יקבל מקור וזמן.</p></div>`;document.getElementById('pageTitle').textContent='Trading Lab'}
function paperTrade(){let ticker=document.getElementById('ticker').value.trim().toUpperCase()||'AAPL',qty=Number(document.getElementById('qty').value)||1;state.trades.push({ticker,qty,side:'BUY',at:Date.now()});state.xp+=10;save();toast('הפעולה נרשמה · +10 XP');paper()}
function analyze(){document.getElementById('app').innerHTML=`<div class="sectionHead"><div><span class="eyebrow">STOCK LAB</span><h2>מעבדת ניתוח</h2></div></div><div class="analyzeSearch"><input id="stockSearch" placeholder="חפש ticker — לדוגמה AAPL, MSFT, NVDA"><button onclick="toast('חיבור לנתוני שוק חיים — בשלב הבא')">נתח</button></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><span class="lime" style="font:700 11px 'Space Grotesk'">AAPL</span><h3 style="margin:5px 0">Apple Inc.</h3><span class="muted">דוגמת ממשק · לא נתון שוק נוכחי</span></div><div style="text-align:left"><div class="big">$172.40</div><span class="lime">+1.84% DEMO</span></div></div>${chart()}<div class="metrics"><div class="metric"><small>P/E</small><b>31.2</b></div><div class="metric"><small>REV GROWTH</small><b>+8.1%</b></div><div class="metric"><small>MARKET CAP</small><b>$2.7T</b></div><div class="metric"><small>DEBT</small><b>Moderate</b></div></div></div><div class="two" style="margin-top:12px"><div class="card"><span class="statLabel">FACTS</span><h3>עובדה ≠ תזה</h3><p class="muted">בניתוח אמיתי נציג מה המקור אומר, מה אנחנו מסיקים ממנו, ומה עדיין לא ידוע.</p></div><div class="card"><span class="statLabel">AI RESEARCH</span><h3>Exa + Firecrawl</h3><p class="muted">בהמשך נחבר חיפוש מקורות וקריאת דוחות ציבוריים, כדי שהניתוח יהיה מבוסס מקור ולא “AI אמר”.</p></div></div>`;document.getElementById('pageTitle').textContent='Stock Lab'}
function glossary(){const t=[['Stock','מניה','חלק בעלות בחברה.'],['ETF','קרן סל','מכשיר שמחזיק סל נכסים ועוקב לרוב אחרי מדד.'],['Market Cap','שווי שוק','מחיר מניה × מספר המניות.'],['P/E','מכפיל רווח','מחיר ביחס לרווח למניה.'],['Volatility','תנודתיות','מידת השינוי במחיר לאורך זמן.'],['Drawdown','ירידה מהשיא','המרחק מהשיא הקודם לשפל.'],['R:R','יחס סיכון/תגמול','השוואה בין ההפסד האפשרי לרווח האפשרי.'],['Position Size','גודל פוזיציה','כמה יחידות מחזיקים בהתאם לסיכון שהוגדר.'],['Backtest','בדיקה היסטורית','בדיקת כלל על נתונים מהעבר.']];document.getElementById('app').innerHTML=`<div class="sectionHead"><div><span class="eyebrow">MARKET DICTIONARY</span><h2>מילון השוק</h2></div></div><div class="terms">${t.map(x=>`<div class="term"><span>${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div>`;document.getElementById('pageTitle').textContent='Market Dictionary'}
function show(x){setNav(x);if(x==='home')home();else if(x==='learn')learn(Math.min(state.done.length,9));else if(x==='paper')paper();else if(x==='analyze')analyze();else glossary()}
function initNav(){const html=nav.map(x=>`<button data-tab="${x[0]}" onclick="show('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('');document.getElementById('nav').innerHTML=html;document.getElementById('bottomNav').innerHTML=html;show('home');updateHeader()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
initNav();
</script></body></html>
